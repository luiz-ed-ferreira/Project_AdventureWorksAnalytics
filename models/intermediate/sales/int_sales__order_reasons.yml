#view documentation:

version: 2

models:
  - name: int_sales__order_reasons
    description: >
      Integrates sales orders with their associated sales reasons.
      Preserves the many-to-many relationship between orders and reasons.
      Grain: one row per sales order and sales reason association.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_id
              - sales_reason_id

    columns:
      - name: sales_order_id
        description: Foreign key identifying the sales order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__sales_order_header')
                field: sales_order_id

      - name: sales_reason_id
        description: Foreign key identifying the sales reason.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__sales_reason')
                field: sales_reason_id

      - name: sales_reason_name
        description: Descriptive name of the sales reason.
        data_tests:
          - not_null

      - name: sales_reason_type
        description: Classification of the sales reason.
        data_tests:
          - not_null

      - name: association_modified_at
        description: Last modification timestamp of the order-reason association.

      - name: reason_modified_at
        description: Last modification timestamp of the sales reason.

