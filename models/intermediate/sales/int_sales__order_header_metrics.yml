# View documentation:

version: 2

models:
  - name: int_sales__order_header_metrics
    description: >
      Provides order-level financial metrics and dimensional keys
      from sales order headers.
      Grain: one row per sales order.
      Financial values are preserved at header level to prevent
      duplication when joining with order detail records.

    columns:
      - name: sales_order_id
        description: Unique identifier of the sales order.
        data_tests:
          - not_null
          - unique

      - name: order_date
        description: Date when the sales order was placed.
        data_tests:
          - not_null

      - name: customer_id
        description: Customer associated with the sales order.
        data_tests:
          - not_null

      - name: salesperson_id
        description: Salesperson responsible for the order, when applicable.

      - name: territory_id
        description: Sales territory associated with the order, when applicable.

      - name: bill_to_address_id
        description: Billing address identifier.

      - name: ship_to_address_id
        description: Shipping address identifier.

      - name: credit_card_id
        description: Credit card identifier, when applicable.

      - name: status
        description: Source sales order status code.

      - name: is_online_order
        description: Indicates whether the order was placed online.

      - name: subtotal_amount
        description: Order subtotal before tax and freight, after line discounts.

      - name: tax_amount
        description: Total tax charged for the order.

      - name: freight_amount
        description: Shipping and handling charge for the order.

      - name: total_due_amount
        description: Total amount due, including subtotal, tax, and freight.

      - name: modified_at
        description: Timestamp of the last source record modification.

