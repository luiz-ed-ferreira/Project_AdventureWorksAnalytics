# View documentation:

version: 2

models:
  - name: int_sales__sales_territory
    description: "Integrated sales territory attributes for dimensional modeling."

    columns:
      - name: territory_id
        description: "Original sales territory business key."
        data_tests:
          - unique
          - not_null

      - name: territory_name
        data_tests:
          - not_null

      - name: country_region_code
        data_tests:
          - not_null

      - name: territory_group
        data_tests:
          - not_null

