
#View documentation:

version: 2

models:
  - name: int_sales__order_details
    description: >
      Integrates sales order detail records with sales order
      header attributes and calculates transactional sales
      metrics.
      Grain: one row per sales order detail.

    columns:
      - name: sales_order_id
        description: Identifier of the sales order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__sales_order_header')
                field: sales_order_id

      - name: sales_order_detail_id
        description: Unique identifier of the sales order detail.
        data_tests:
          - not_null
          - unique

      - name: order_date
        description: Date when the sales order was placed.
        data_tests:
          - not_null

      - name: customer_id
        description: Identifier of the customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__customer')
                field: customer_id

      - name: product_id
        description: Identifier of the purchased product.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_production__product')
                field: product_id

      - name: order_quantity
        description: Quantity of products purchased.
        data_tests:
          - not_null

      - name: unit_price
        description: Unit selling price of the product.
        data_tests:
          - not_null

      - name: unit_price_discount
        description: Discount percentage applied to the unit price.
        data_tests:
          - not_null

      - name: gross_sales_amount
        description: Gross sales before discounts.

      - name: discount_amount
        description: Total discount applied to the order detail.

      - name: net_sales_amount
        description: Net sales after discounts.

