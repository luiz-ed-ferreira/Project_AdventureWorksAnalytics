#View documentation:

version: 2

models:
  - name: int_sales__geography
    description: >
      Integrates address records with their associated state/province
      and country attributes. The model preserves one row per address.
    columns:
      - name: address_id
        description: Unique identifier of the address.
        data_tests:
          - not_null
          - unique

      - name: address_line_1
        description: Primary street address.

      - name: address_line_2
        description: Secondary street address information.

      - name: city
        description: City associated with the address.

      - name: postal_code
        description: Postal code associated with the address.

      - name: state_province_id
        description: Identifier of the associated state or province.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_person__state_province')
                field: state_province_id

      - name: state_province_code
        description: State or province code.

      - name: state_province_name
        description: State or province name.

      - name: is_only_state_province
        description: Indicates whether the record represents a state/province only.

      - name: territory_id
        description: Identifier of the associated sales territory.

      - name: country_region_code
        description: Code identifying the associated country or region.

      - name: country_region_name
        description: Name of the associated country or region.

      - name: address_modified_at
        description: Timestamp when the source address record was last modified.

      - name: state_province_modified_at
        description: Timestamp when the source state/province record was last modified.

      - name: country_region_modified_at
        description: Timestamp when the source country/region record was last modified.

