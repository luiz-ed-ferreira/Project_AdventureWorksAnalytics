#View documentation:

version: 2

models:
  - name: stg_person__employee
    description: >
      Standardizes employee records with relevant job and employment
      attributes for sales analysis.
    columns:
      - name: business_entity_id
        description: Unique identifier of the employee.
        data_tests:
          - not_null
          - unique

      - name: job_title
        description: Employee job title.

      - name: hire_date
        description: Employee hiring date.

      - name: current_flag
        description: Indicates whether the employee is currently active.

      - name: modified_at
        description: Timestamp when the source employee record was last modified.

