#View documentation:

version: 2

models:
  - name: stg_person__country_region
    description: >
      Standardized country and region reference data.
      Source country codes are preserved without imputing missing values.
      One record per country or region.

    columns:
      - name: country_region_code
        description: Country or region code assigned by the source system.
        data_tests:
          - unique

      - name: country_region_name
        description: Country or region name.
        data_tests:
          - not_null

      - name: modified_at
        description: Timestamp of the last source record modification.

