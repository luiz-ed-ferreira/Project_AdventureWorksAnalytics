#View documentation:

version: 2

models:
  - name: stg_person__address
    description: >
      Standardized address data containing street, city,
      state province, and postal code attributes.
      Spatial coordinates are intentionally excluded.
      One record per address.

    columns:
      - name: address_id
        description: Unique identifier of the address.
        data_tests:
          - not_null
          - unique

      - name: address_line_1
        description: Primary street address.

      - name: address_line_2
        description: Additional street address information, when available.

      - name: city
        description: City associated with the address.
        data_tests:
          - not_null

      - name: state_province_id
        description: Identifier of the associated state or province.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_person__state_province')
                field: state_province_id

      - name: postal_code
        description: Postal or ZIP code.

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

