#View documentation:

version: 2

models:
  - name: stg_person__person
    description: >
      Standardized person records containing identification,
      classification, and name attributes.
      Unnecessary contact and demographic information is excluded.
      One record per person.

    columns:
      - name: person_id
        description: Unique identifier of the person.
        data_tests:
          - not_null
          - unique

      - name: person_type
        description: Classification of the person in the source system.
        data_tests:
          - not_null

      - name: name_style
        description: Indicates whether the person's name follows the source system's alternate naming style.

      - name: title
        description: Person's title, when available.

      - name: first_name
        description: Person's first name.
        data_tests:
          - not_null

      - name: middle_name
        description: Person's middle name, when available.

      - name: last_name
        description: Person's last name.
        data_tests:
          - not_null

      - name: suffix
        description: Person's name suffix, when available.

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

