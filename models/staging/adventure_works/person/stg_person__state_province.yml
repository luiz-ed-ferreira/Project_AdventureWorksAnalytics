#View documentation:

version: 2

models:
  - name: stg_person__state_province
    description: >
      Standardized state and province reference data.
      Each record represents one state or province.

    columns:
      - name: state_province_id
        description: Unique identifier of the state or province.
        data_tests:
          - not_null
          - unique

      - name: state_province_code
        description: Abbreviated code assigned to the state or province.

      - name: country_region_code
        description: Code identifying the associated country or region.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_person__country_region')
                field: country_region_code

      - name: is_only_state_province
        description: Indicates whether the country or region has only one state or province.

      - name: state_province_name
        description: Name of the state or province.
        data_tests:
          - not_null

      - name: territory_id
        description: Identifier of the associated sales territory, when available.

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

