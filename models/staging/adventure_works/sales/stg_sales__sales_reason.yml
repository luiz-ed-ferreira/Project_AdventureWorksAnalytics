#View documentation:

version: 2

models:
  - name: stg_sales__sales_reason
    description: >
      Standardized sales reason data from the Adventure Works source.
      One record per registered sales reason.

    columns:
      - name: sales_reason_id
        description: Unique identifier of the sales reason.
        data_tests:
          - not_null
          - unique

      - name: sales_reason_name
        description: Name or description of the sales reason.
        data_tests:
          - not_null

      - name: sales_reason_type
        description: Category assigned to the sales reason.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Marketing
                  - Other
                  - Promotion

      - name: modified_at
        description: Timestamp of the last source record modification.

