#View documentation:

version: 2

models:
  - name: stg_sales__sales_person
    description: >
      Standardized sales person data, including sales targets,
      bonuses, commissions, and sales performance metrics.
      One record per sales person.

    columns:
      - name: sales_person_id
        description: Unique identifier of the sales person, based on business entity ID.
        data_tests:
          - not_null
          - unique

      - name: territory_id
        description: Identifier of the assigned sales territory.

      - name: sales_quota
        description: Sales quota assigned to the sales person.

      - name: bonus
        description: Bonus amount assigned to the sales person.

      - name: commission_pct
        description: Commission percentage assigned to the sales person.

      - name: sales_ytd
        description: Year-to-date sales amount.

      - name: sales_last_year
        description: Sales amount recorded in the previous year.

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

