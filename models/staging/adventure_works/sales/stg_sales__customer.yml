
#View documentation:

version: 2

models:
  - name: stg_sales__customer
    description: >
      Standardized customer data from the Adventure Works source.
      One record per customer.

    columns:
      - name: customer_id
        description: Unique identifier of the customer.
        data_tests:
          - not_null
          - unique

      - name: person_id
        description: Identifier of the associated person, when available.

      - name: store_id
        description: Identifier of the associated store, when available.

      - name: territory_id
        description: Identifier of the assigned sales territory.

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

