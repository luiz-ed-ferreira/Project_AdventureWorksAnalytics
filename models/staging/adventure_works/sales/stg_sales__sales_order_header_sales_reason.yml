#View documentation:

version: 2

models:
  - name: stg_sales__sales_order_header_sales_reason
    description: >
      Standardized association between sales orders and sales reasons.
      One record per sales order and sales reason combination.
      Preserves the many-to-many relationship between orders and reasons.

    columns:
      - name: sales_order_id
        description: Identifier of the associated sales order.
        data_tests:
          - not_null

      - name: sales_reason_id
        description: Identifier of the associated sales reason.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales__sales_reason')
                field: sales_reason_id

      - name: modified_at
        description: Timestamp of the last source record modification.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_id
              - sales_reason_id

