#View documentation:

version: 2

models:
  - name: stg_sales__sales_order_detail
    description: >
      Standardized sales order detail data from the Adventure Works source.
      One record per sales order line item.

    columns:
      - name: sales_order_id
        description: Identifier of the sales order.
        data_tests:
          - not_null

      - name: sales_order_detail_id
        description: Unique identifier of the sales order detail line.
        data_tests:
          - not_null
          - unique

      - name: carrier_tracking_number
        description: Shipment carrier tracking number.

      - name: order_quantity
        description: Number of units purchased in the order detail.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the purchased product.
        data_tests:
          - not_null

      - name: special_offer_id
        description: Identifier of the special offer applied to the item.

      - name: unit_price
        description: Selling price per unit before discount.
        data_tests:
          - not_null

      - name: unit_price_discount
        description: Discount percentage applied to the unit price.
        data_tests:
          - not_null

      - name: rowguid
        description: Source system row globally unique identifier.

      - name: modified_at
        description: Timestamp of the last source record modification.

