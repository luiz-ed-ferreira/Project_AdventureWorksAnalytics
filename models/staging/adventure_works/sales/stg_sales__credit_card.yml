#View documentation:

version: 2

models:
  - name: stg_sales__credit_card
    description: >
      Standardized credit card reference data.
      Sensitive card numbers and unused expiration details
      are intentionally excluded.
      One record per credit card.

    columns:
      - name: credit_card_id
        description: Unique identifier of the credit card.
        data_tests:
          - not_null
          - unique

      - name: card_type
        description: Credit card brand or type.
        data_tests:
          - not_null

      - name: modified_at
        description: Timestamp of the last source record modification.

