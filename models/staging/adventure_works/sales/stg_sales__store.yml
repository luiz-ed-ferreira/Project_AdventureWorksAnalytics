#View documentation:

version: 2

models:
  - name: stg_sales__store
    description: >
      Cleaned staging model for Adventure Works stores.
      Standardizes store identifiers, names, salesperson references,
      and modification timestamps.

    columns:
      - name: store_id
        description: Unique identifier of the store and primary key.
        data_tests:
          - not_null
          - unique

      - name: store_name
        description: Name of the store.
        data_tests:
          - not_null

      - name: salesperson_id
        description: Identifier of the salesperson responsible for the store.

      - name: modified_at
        description: Timestamp when the source record was last modified.


