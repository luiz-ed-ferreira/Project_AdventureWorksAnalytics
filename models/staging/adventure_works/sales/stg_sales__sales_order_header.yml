#View documentation:


version: 2

models:
  - name: stg_sales__sales_order_header
    description: >
      Standardized sales order header data from the Adventure Works source.
      One record per sales order.

    columns:
      - name: sales_order_id
        description: Unique identifier of the sales order.
        data_tests:
          - not_null
          - unique

      - name: revision_number
        description: Revision number of the sales order.

      - name: order_date
        description: Date when the sales order was created.
        data_tests:
          - not_null

      - name: due_date
        description: Expected payment or fulfillment due date.

      - name: ship_date
        description: Date when the sales order was shipped.

      - name: status
        description: Numeric status code of the sales order.

      - name: is_online_order
        description: Indicates whether the order was placed online.

      - name: purchase_order_number
        description: Purchase order number provided by the customer, when available.

      - name: account_number
        description: Customer account reference associated with the order.

      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null

      - name: salesperson_id
        description: Identifier of the salesperson associated with the order, when available.

      - name: territory_id
        description: Identifier of the sales territory associated with the order.

      - name: bill_to_address_id
        description: Identifier of the billing address.

      - name: ship_to_address_id
        description: Identifier of the shipping destination address.

      - name: ship_method_id
        description: Identifier of the shipping method.

      - name: credit_card_id
        description: Identifier of the credit card used for payment, when available.

      - name: credit_card_approval_code
        description: Credit card transaction approval code, when available.

      - name: currency_rate_id
        description: Identifier of the exchange rate applied to the order, when available.

      - name: subtotal
        description: Order subtotal before taxes and freight, after item discounts.

      - name: tax_amount
        description: Total tax amount charged for the order.

      - name: freight
        description: Shipping and freight charges associated with the order.

      - name: total_due
        description: Total amount due, including subtotal, taxes, and freight.

      - name: comments
        description: Additional comments associated with the sales order, when available.

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

