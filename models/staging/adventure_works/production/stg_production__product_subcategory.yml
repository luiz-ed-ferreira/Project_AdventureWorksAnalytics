#View documentation:

version: 2

models:
  - name: stg_production__product_subcategory
    description: >
      Standardized product subcategory reference data.
      Each record represents one product subcategory
      associated with a product category.

    columns:
      - name: product_subcategory_id
        description: Identifier of the associated product subcategory.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_production__product_subcategory')
                field: product_subcategory_id

      - name: product_category_id
        description: Identifier of the associated product category.
        data_tests:
          - not_null

      - name: product_subcategory_name
        description: Name of the product subcategory.
        data_tests:
          - not_null

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

