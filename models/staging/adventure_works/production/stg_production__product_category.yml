#View documentation:

version: 2

models:
  - name: stg_production__product_category
    description: >
      Standardized product category reference data.
      Each record represents one product category.

    columns:
      - name: product_category_id
        description: Identifier of the associated product category.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_production__product_category')
                field: product_category_id

      - name: product_category_name
        description: Name of the product category.
        data_tests:
          - not_null

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

