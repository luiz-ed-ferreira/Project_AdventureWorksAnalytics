#View documentation:

version: 2

models:
  - name: stg_production__product
    description: >
      Standardized product reference data containing product
      identification, classification, pricing, manufacturing,
      and lifecycle attributes.
      One record per product.

    columns:
      - name: product_id
        description: Unique identifier of the product.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Product name.
        data_tests:
          - not_null

      - name: product_number
        description: Business identifier assigned to the product.
        data_tests:
          - not_null
          - unique

      - name: is_manufactured_in_house
        description: Indicates whether the product is manufactured in-house.

      - name: is_finished_good
        description: Indicates whether the product is a finished good.

      - name: color
        description: Product color, when available.

      - name: safety_stock_level
        description: Minimum inventory level maintained for the product.

      - name: reorder_point
        description: Inventory level that triggers replenishment.

      - name: standard_cost
        description: Standard manufacturing or acquisition cost.

      - name: list_price
        description: Product list price.

      - name: size
        description: Product size, when applicable.

      - name: size_unit_measure_code
        description: Unit of measure used for product size.

      - name: weight_unit_measure_code
        description: Unit of measure used for product weight.

      - name: weight
        description: Product weight, when available.

      - name: days_to_manufacture
        description: Number of days required to manufacture the product.

      - name: product_line
        description: Product line classification.

      - name: product_class
        description: Product class classification.

      - name: product_style
        description: Product style classification.

      - name: product_subcategory_id
        description: Identifier of the associated product subcategory.

      - name: product_model_id
        description: Identifier of the associated product model.

      - name: sell_start_date
        description: Date when the product became available for sale.

      - name: sell_end_date
        description: Date when the product stopped being available for sale.

      - name: discontinued_date
        description: Date when the product was discontinued, when applicable.

      - name: rowguid
        description: Globally unique identifier assigned to the source record.

      - name: modified_at
        description: Timestamp of the last source record modification.

