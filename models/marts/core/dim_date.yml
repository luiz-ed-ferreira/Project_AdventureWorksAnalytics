
#Table documentation:

version: 2

models:
  - name: dim_date
    description: "Calendar dimension covering the sales data reference period."

    columns:
      - name: date_key
        description: "Surrogate date key in YYYYMMDD format."
        data_tests:
          - unique
          - not_null

      - name: date_day
        description: "Calendar date."
        data_tests:
          - unique
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

      - name: day_of_month
        data_tests:
          - not_null

