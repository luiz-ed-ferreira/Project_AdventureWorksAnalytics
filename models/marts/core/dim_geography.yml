# Table documentation:

version: 2

models:
  - name: dim_geography
    description: "Geography dimension combining address, state/province, and country attributes."

    columns:
      - name: geography_key
        description: "Surrogate key identifying each address."
        data_tests:
          - unique
          - not_null

      - name: address_id
        description: "Original address business key."
        data_tests:
          - unique
          - not_null

      - name: city
        data_tests:
          - not_null

      - name: country_region_name
        data_tests:
          - not_null

