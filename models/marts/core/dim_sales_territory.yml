# Table documentation:

version: 2

models:
  - name: dim_sales_territory
    description: "Sales territory dimension containing commercial regions and financial performance attributes."

    columns:
      - name: sales_territory_key
        description: "Surrogate key identifying each sales territory."
        data_tests:
          - unique
          - not_null

      - name: territory_id
        description: "Original sales territory business key."
        data_tests:
          - unique
          - not_null

      - name: territory_name
        data_tests:
          - not_null

      - name: country_region_code
        data_tests:
          - not_null

      - name: territory_group
        data_tests:
          - not_null

