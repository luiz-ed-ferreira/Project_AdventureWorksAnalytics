# Table documentation:


version: 2

models:
  - name: fact_sales
    description: "Sales fact table at order detail level. Each record represents one sales order line."

    columns:
      - name: sales_order_id
        description: "Sales order identifier."
        data_tests:
          - not_null

      - name: sales_order_detail_id
        description: "Sales order detail identifier."
        data_tests:
          - not_null

      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: due_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: ship_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: credit_card_key
        description: "May be null when the original sales transaction has no associated credit card."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_credit_card')
                field: credit_card_key

      - name: salesperson_key
        description: "May be null for online orders without an associated salesperson."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_salesperson')
                field: salesperson_key

      - name: sales_territory_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_territory')
                field: sales_territory_key

      - name: bill_to_geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: ship_to_geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

