# Table documentation:

version: 2

models:
  - name: bridge_order_sales_reason
    description: "Bridge table connecting sales orders to their associated sales reasons. Grain: one row per sales order and sales reason combination."

    columns:
      - name: sales_order_id
        description: "Sales order identifier."
        data_tests:
          - not_null

      - name: sales_reason_id
        description: "Sales reason identifier."
        data_tests:
          - not_null

      - name: sales_reason_key
        description: "Foreign key referencing the sales reason dimension."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_reason')
                field: sales_reason_key

