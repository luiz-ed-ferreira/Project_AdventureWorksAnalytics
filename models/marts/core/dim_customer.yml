# table documentation:

version: 2

models:
  - name: dim_customer
    description: "Customer dimension combining individual and store attributes."

    columns:
      - name: customer_key
        description: "Surrogate key identifying each customer."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Original customer business key."
        data_tests:
          - unique
          - not_null

      - name: person_type
        description: "Customer classification from the person record."

