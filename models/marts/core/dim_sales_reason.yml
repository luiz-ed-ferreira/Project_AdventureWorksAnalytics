# Table documentation:

version: 2

models:
  - name: dim_sales_reason
    description: "Sales reason dimension containing reason names and classifications."

    columns:
      - name: sales_reason_key
        description: "Surrogate key identifying each sales reason."
        data_tests:
          - unique
          - not_null

      - name: sales_reason_id
        description: "Original sales reason business key."
        data_tests:
          - unique
          - not_null

      - name: sales_reason_name
        data_tests:
          - not_null

      - name: sales_reason_type
        data_tests:
          - not_null

