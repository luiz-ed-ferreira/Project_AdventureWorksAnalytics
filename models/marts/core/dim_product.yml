#Table documentation:
version: 2

models:
  - name: dim_product
    description: "Product dimension with product, subcategory, and category attributes."

    columns:
      - name: product_key
        description: "Surrogate key identifying each product."
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: "Original business key from the source system."
        data_tests:
          - unique
          - not_null

      - name: product_name
        data_tests:
          - not_null

