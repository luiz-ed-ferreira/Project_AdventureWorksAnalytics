# Table documentation:

version: 2

models:
  - name: dim_salesperson
    description: "Salesperson dimension combining employee, personal, and sales performance attributes."

    columns:
      - name: salesperson_key
        description: "Surrogate key identifying each salesperson."
        data_tests:
          - unique
          - not_null

      - name: sales_person_id
        description: "Original salesperson business key."
        data_tests:
          - unique
          - not_null

      - name: job_title
        data_tests:
          - not_null

      - name: current_flag
        description: "Indicates whether the salesperson record is currently active."
        data_tests:
          - not_null

