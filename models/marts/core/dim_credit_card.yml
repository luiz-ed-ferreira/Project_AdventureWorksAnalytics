# Table documentation:

version: 2

models:
  - name: dim_credit_card
    description: "Credit card dimension containing card classification attributes."

    columns:
      - name: credit_card_key
        description: "Surrogate key identifying each credit card."
        data_tests:
          - unique
          - not_null

      - name: credit_card_id
        description: "Original credit card business key."
        data_tests:
          - unique
          - not_null

      - name: card_type
        description: "Credit card classification."
        data_tests:
          - not_null

