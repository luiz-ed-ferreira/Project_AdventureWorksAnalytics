# Reporting documentation:

version: 2

models:
  - name: rpt_sales__reason_analysis
    description: >
      Sales performance analysis by sales reason, including order volume,
      quantity, and financial metrics. Financial values are non-additive
      across reasons because an order may have multiple associated reasons.

    columns:
      - name: sales_reason_key
        description: Unique sales reason dimension key.
        data_tests:
          - not_null
          - unique

      - name: sales_reason_id
        data_tests:
          - not_null

      - name: sales_reason_name
        data_tests:
          - not_null

      - name: sales_reason_type
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: total_quantity
        data_tests:
          - not_null

      - name: gross_sales
        data_tests:
          - not_null

      - name: total_discounts
        data_tests:
          - not_null

      - name: net_sales
        data_tests:
          - not_null

      - name: average_order_value
        data_tests:
          - not_null

