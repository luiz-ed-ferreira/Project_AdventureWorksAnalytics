# Reporting documentation:

version: 2

models:
  - name: rpt_sales__promotion_performance
    description: >
      Product sales performance for orders associated with the
      Promotion sales reason, including order volume, quantity,
      and financial metrics.

    columns:
      - name: product_key
        description: Unique product dimension key.
        data_tests:
          - not_null
          - unique

      - name: product_id
        data_tests:
          - not_null

      - name: product_name
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: total_quantity
        data_tests:
          - not_null

      - name: gross_sales
        data_tests:
          - not_null

      - name: total_discounts
        data_tests:
          - not_null

      - name: net_sales
        data_tests:
          - not_null

      - name: average_selling_price
        data_tests:
          - not_null

