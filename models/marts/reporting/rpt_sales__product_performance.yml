# Reporting documentation:


version: 2

models:
  - name: rpt_sales__product_performance
    description: >
      Product sales performance overview, including product hierarchy,
      order volume, sales quantity, gross sales, discounts, net sales,
      and average selling price.

    columns:
      - name: product_key
        description: Unique product key.
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: Source product identifier.
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: Product name.
        data_tests:
          - not_null

      - name: total_orders
        description: Number of distinct orders containing the product.
        data_tests:
          - not_null

      - name: total_quantity
        description: Total quantity sold for the product.
        data_tests:
          - not_null

      - name: gross_sales
        description: Total gross sales before discounts.
        data_tests:
          - not_null

      - name: total_discounts
        description: Total discounts applied to the product sales.
        data_tests:
          - not_null

      - name: net_sales
        description: Total sales after discounts.
        data_tests:
          - not_null

      - name: average_selling_price
        description: Net sales divided by total quantity sold.
        data_tests:
          - not_null

