# Reporting documentation:

version: 2

models:
  - name: rpt_sales__salesperson_performance
    description: >
      Sales performance overview by salesperson, including order volume,
      sales quantity, financial metrics, quota, and historical sales indicators.

    columns:
      - name: salesperson_key
        description: Unique salesperson dimension key.
        data_tests:
          - not_null
          - unique

      - name: sales_person_id
        data_tests:
          - not_null

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: total_quantity
        data_tests:
          - not_null

      - name: gross_sales
        data_tests:
          - not_null

      - name: total_discounts
        data_tests:
          - not_null

      - name: net_sales
        data_tests:
          - not_null

      - name: average_order_value
        data_tests:
          - not_null

