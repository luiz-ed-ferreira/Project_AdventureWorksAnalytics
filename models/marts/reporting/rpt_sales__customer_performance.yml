# Reporting documentation:

version: 2

models:
  - name: rpt_sales__customer_performance
    description: >
      Customer sales performance overview, including customer
      identification, customer type, order volume, sales quantity,
      gross sales, discounts, net sales, and average order value.

    columns:
      - name: customer_key
        description: Unique customer key.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Source customer identifier.
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: Customer name, using store name when available.
        data_tests:
          - not_null

      - name: customer_type
        description: >
          Customer classification based on person and store associations.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Person', 'Store', 'Both', 'Unknown']

      - name: total_orders
        description: Number of distinct orders placed by the customer.
        data_tests:
          - not_null

      - name: total_quantity
        description: Total quantity of products purchased.
        data_tests:
          - not_null

      - name: gross_sales
        description: Total gross sales before discounts.
        data_tests:
          - not_null

      - name: total_discounts
        description: Total discounts applied to customer purchases.
        data_tests:
          - not_null

      - name: net_sales
        description: Total sales after discounts.
        data_tests:
          - not_null

      - name: average_order_value
        description: Net sales divided by the number of distinct orders.
        data_tests:
          - not_null

