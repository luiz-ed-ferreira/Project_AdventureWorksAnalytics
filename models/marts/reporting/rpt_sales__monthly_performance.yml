# Reporting documentation:

version: 2

models:
  - name: rpt_sales__monthly_performance
    description: >
      Monthly sales performance overview, including order volume,
      sales quantity, gross sales, discounts, net sales, and
      average order value.

    columns:
      - name: year
        description: Calendar year.
        data_tests:
          - not_null

      - name: month
        description: Calendar month number.
        data_tests:
          - not_null

      - name: month_name
        description: Calendar month name.
        data_tests:
          - not_null

      - name: total_orders
        description: Number of distinct sales orders.
        data_tests:
          - not_null

      - name: total_quantity
        description: Total quantity of products sold.
        data_tests:
          - not_null

      - name: gross_sales
        description: Total gross sales before discounts.
        data_tests:
          - not_null

      - name: total_discounts
        description: Total discounts applied to sales.
        data_tests:
          - not_null

      - name: net_sales
        description: Total sales after discounts.
        data_tests:
          - not_null

      - name: average_order_value
        description: Net sales divided by the number of distinct orders.
        data_tests:
          - not_null

