# Reporting documentation:

version: 2

models:
  - name: rpt_sales__territory_performance
    description: >
      Sales performance overview by territory, including order volume,
      sales quantity, financial metrics, and historical territory indicators.

    columns:
      - name: sales_territory_key
        description: Unique sales territory dimension key.
        data_tests:
          - not_null
          - unique

      - name: territory_id
        data_tests:
          - not_null

      - name: territory_name
        data_tests:
          - not_null

      - name: territory_group
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: total_quantity
        data_tests:
          - not_null

      - name: gross_sales
        data_tests:
          - not_null

      - name: total_discounts
        data_tests:
          - not_null

      - name: net_sales
        data_tests:
          - not_null

      - name: average_order_value
        data_tests:
          - not_null
          
