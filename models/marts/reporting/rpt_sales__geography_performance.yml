# Reporting documentation:

version: 2

models:
  - name: rpt_sales__geography_performance
    description: >
      Geographic sales performance at shipping address level,
      including order volume, sales quantity, and financial metrics.

    columns:
      - name: geography_key
        description: Unique shipping geography identifier.
        data_tests:
          - not_null
          - unique

      - name: city
        data_tests:
          - not_null

      - name: country_region_name
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: total_quantity
        data_tests:
          - not_null

      - name: gross_sales
        data_tests:
          - not_null

      - name: total_discounts
        data_tests:
          - not_null

      - name: net_sales
        data_tests:
          - not_null

