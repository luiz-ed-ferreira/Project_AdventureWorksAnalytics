
#Project
name: 'adventure_works_analytics'
version: '1.0.0'
config-version: 2

#Profile configuration
profile: 'adventure_works_analytics'

#Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

#Model configurations
models:
  adventure_works_analytics:

    staging:
      +materialized: view #Avoid unnecessary data duplication

    intermediate:
      +materialized: view #Facilitate the creation of business rules

    marts:
      +materialized: table #Persist the results, ready for analysis

#Notes: 
 #An important difference: a View stores the query definition, whereas a Table persists the results in Databricks
